<!DOCTYPE html>
<html lang="ro">

<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot</title>
  <link rel="stylesheet" href="{% static 'CSS/style.css' %}">
  <link rel="stylesheet" href="{% static 'CSS/chatbot_style.css' %}">
</head>

<body>
  <a class="back-link" href="{% url 'home' %}">Înapoi la pagina principală</a>
  <div class="chat-container" id="chat-container" role="log"></div>
  <form id="chat-form">
    <input type="text" id="user-input" placeholder="Scrie a, b sau c..." aria-label="Răspunsul tău" autocomplete="off">
    <button type="submit">Trimite</button>
  </form>
  <script src="{% static 'JS/chatbot_js.js' %}"></script>
</body>

</html>
