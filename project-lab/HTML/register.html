<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inregistrare</title>
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="stylesheet" href="../CSS/register_style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>Inregistreaza-te</h1>

      <form class="register-form" action="#" method="post" enctype="multipart/form-data">
        <div class="row">
          <label for="username">Nume utilizator</label>
          <input type="text" id="username" name="username" placeholder="ex: Ion" required>
        </div>

        <div class="row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="nume@exemplu.com" required>
        </div>

        <div class="row two-col">
          <div>
            <label for="password">Parola</label>
            <input type="password" id="password" name="password" required>
          </div>
          <div>
            <label for="confirm_password">Confirma parola</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
          </div>
        </div>

        <div class="row">
          <label for="birthdate">Data nasterii</label>
          <input type="date" id="birthdate" name="birthdate">
        </div>

        <div class="row">
          <span class="group-label">Gen</span>
          <div class="radio-group">
            <label><input type="radio" name="gender" value="feminin"> Feminin</label>
            <label><input type="radio" name="gender" value="masculin"> Masculin</label>
            <label><input type="radio" name="gender" value="altul"> Altul</label>
          </div>
        </div>

        <div class="row">
          <label for="country">Tara</label>
          <select id="country" name="country">
            <option value="">Selecteaza</option>
            <option value="ro">Romania</option>
            <option value="md">Republica Moldova</option>
            <option value="de">Germania</option>
            <option value="fr">Franta</option>
            <option value="other">Alta tara</option>
          </select>
        </div>

        <div class="row">
          <span class="group-label">Interese</span>
          <div class="checkbox-grid">
            <label><input type="checkbox" name="interests" value="frontend"> Frontend</label>
            <label><input type="checkbox" name="interests" value="backend"> Backend</label>
            <label><input type="checkbox" name="interests" value="uiux"> UI/UX</label>
            <label><input type="checkbox" name="interests" value="javascript"> JavaScript</label>
            <label><input type="checkbox" name="interests" value="python"> Python</label>
            <label><input type="checkbox" name="interests" value="web"> Web</label>
            <label><input type="checkbox" name="interests" value="wordpress"> WordPress</label>
            <label><input type="checkbox" name="interests" value="django"> Django</label>
          </div>
        </div>

        <div class="row">
          <label for="avatar">Incarca avatar</label>
          <input type="file" id="avatar" name="avatar" accept="image/*">
        </div>

        <div class="row">
          <label for="bio">Scurta descriere</label>
          <textarea id="bio" name="bio" placeholder="Scrie cateva cuvinte despre tine..."></textarea>
        </div>

        <div class="actions">
          <button type="submit" class="btn primary">Creeaza cont</button>
          <button type="reset" class="btn ghost">Reseteaza</button>
        </div>

        <p class="login-link">Ai deja cont? <a href="login.html">Mergi la login</a></p>
      </form>
    </section>
  </main>
</body>
</html>
